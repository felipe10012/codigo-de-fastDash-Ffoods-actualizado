<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FastDash Ffoods - Inicio de sesion para pedir tu comida favorita">
    <title>FastDash Ffoods | Iniciar sesion</title>
    <style>
        :root {
            --color-primario: purple;
            --color-acento: red;
            --color-calido: orange;
            --color-texto: #222222;
            --color-texto-suave: #666666;
            --color-error: #c62828;
            --color-exito: #2e7d32;
            --radio-boton: 50px;
            --sombra-tarjeta: 0px 10px 40px rgba(80, 0, 60, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--color-texto);
            background: #faf8fc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .encabezado {
            padding: 48px 20px;
            text-align: center;
            color: white;
            background: linear-gradient(to bottom, var(--color-primario), var(--color-acento), var(--color-calido));
        }

        .encabezado h1 {
            margin: 0;
            font-size: clamp(40px, 8vw, 56px);
            letter-spacing: 2px;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
        }

        .encabezado p {
            margin: 10px 0 0;
            font-size: clamp(16px, 3vw, 20px);
            opacity: 0.95;
        }

        .contenido {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 16px;
        }

        .tarjeta {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 24px;
            box-shadow: var(--sombra-tarjeta);
            padding: 36px 30px;
            text-align: center;
        }

        .tarjeta h2 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        .tarjeta > p.subtitulo {
            margin: 0 0 24px;
            color: var(--color-texto-suave);
            font-size: 15px;
        }

        .campo {
            text-align: left;
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .campo input {
            width: 100%;
            height: 50px;
            border: 2px solid #e3dcef;
            border-radius: var(--radio-boton);
            padding: 0 18px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .campo input:focus {
            border-color: var(--color-primario);
            box-shadow: 0 4px 16px rgba(128, 0, 128, 0.25);
        }

        .campo input.invalido {
            border-color: var(--color-error);
        }

        .mensaje-error {
            display: block;
            min-height: 18px;
            margin-top: 5px;
            font-size: 13px;
            color: var(--color-error);
        }

        .boton-principal {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: var(--radio-boton);
            background: linear-gradient(to right, var(--color-primario), var(--color-acento));
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
        }

        .boton-principal:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(128, 0, 64, 0.35);
        }

        .boton-principal:active {
            transform: translateY(0);
        }

        .boton-enlace {
            background: none;
            border: none;
            color: var(--color-primario);
            font-size: 15px;
            cursor: pointer;
            padding: 12px 4px 0;
        }

        .boton-enlace:hover {
            text-decoration: underline;
        }

        .crear-cuenta {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #eee6f6;
            font-size: 15px;
            color: var(--color-texto-suave);
        }

        .crear-cuenta button {
            background: none;
            border: none;
            color: var(--color-acento);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .crear-cuenta button:hover {
            text-decoration: underline;
        }

        .mensaje-estado {
            margin-top: 18px;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 15px;
            display: none;
        }

        .mensaje-estado.visible {
            display: block;
        }

        .mensaje-estado.exito {
            background: #e8f5e9;
            color: var(--color-exito);
        }

        .mensaje-estado.info {
            background: #f3e9fb;
            color: #6a1b9a;
        }

        footer.pie {
            padding: 18px;
            text-align: center;
            font-size: 13px;
            color: var(--color-texto-suave);
        }

        @media (max-width: 480px) {
            .encabezado {
                padding: 36px 14px;
            }
            .tarjeta {
                padding: 28px 20px;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>
    <header class="encabezado">
        <h1>FastDash</h1>
        <p>Tu comida favorita, rapidisimo en tu puerta</p>
    </header>

    <main class="contenido">
        <section class="tarjeta" aria-labelledby="titulo-login">
            <h2 id="titulo-login">Iniciar sesion</h2>
            <p class="subtitulo">Ingresa tus datos para continuar</p>

            <form id="formulario-login" novalidate>
                <div class="campo">
                    <label for="correo">Correo electronico</label>
                    <input type="email" id="correo" name="correo"
                           placeholder="tucorreo@ejemplo.com"
                           autocomplete="email"
                           aria-describedby="error-correo">
                    <span class="mensaje-error" id="error-correo" role="alert"></span>
                </div>

                <div class="campo">
                    <label for="contrasena">Contrasena</label>
                    <input type="password" id="contrasena" name="contrasena"
                           placeholder="Tu contrasena"
                           autocomplete="current-password"
                           aria-describedby="error-contrasena">
                    <span class="mensaje-error" id="error-contrasena" role="alert"></span>
                </div>

                <button type="submit" class="boton-principal">Continuar</button>

                <button type="button" class="boton-enlace" id="boton-recuperar">
                    ¿Olvidaste tu contrasena?
                </button>

                <p class="mensaje-estado" id="mensaje-estado"></p>
            </form>

            <div class="crear-cuenta">
                ¿No tienes cuenta?
                <button type="button" id="boton-crear-cuenta">Crear una cuenta</button>
            </div>
        </section>
    </main>

    <footer class="pie">
        FastDash Ffoods &copy; 2026
    </footer>

    <script src="login.js"></script>
</body>
</html>
